<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8842c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ReRT EQD2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ReRT EQD2</title>
<style>
/* Mobile-first wizard. Fully offline: no external fonts, scripts or images. */
:root{
  --bg:#faf7ef; --card:#ffffff; --ink:#1f1c15; --muted:#6e6655; --line:#e2d8c0;
  --gold:#a8842c; --gold-ink:#ffffff; --gold-soft:#f4ecd6; --slot:#fbf0d2; --calc:#f3efe4;
  --ok:#2f7a4a; --ok-bg:#e3f1e7; --warn:#946400; --warn-bg:#fbefd2; --bad:#a3282b; --bad-bg:#f8e1e1;
  --c1:#b9a46e; --c2:#5b6f8f; --c3:#6f9a6a;
  --serif:"Times New Roman",Times,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14120d; --card:#1e1b14; --ink:#efe9da; --muted:#a79e88; --line:#3a3424;
  --gold:#d4ae57; --gold-ink:#1a160c; --gold-soft:#2b2516; --slot:#2f2814; --calc:#25211a;
  --ok:#83d19c; --ok-bg:#1b3223; --warn:#e9bf5f; --warn-bg:#372b10; --bad:#f28e90; --bad-bg:#3a1a1b;
  --c1:#9d8b59; --c2:#8098bb; --c3:#86b580; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px double var(--gold);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand b{font-family:var(--serif);font-size:19px}
.brand span{font-size:12px;color:var(--muted);text-align:right}
.steps{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:13.5px;font-family:var(--sans);cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.chip.done:not(.on){color:var(--ink);border-color:var(--gold)}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
h2{font-family:var(--serif);font-size:22px;margin:4px 0 0}
.lead{color:var(--muted);font-size:14.5px;margin:-4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.card.slot{background:var(--slot);border-color:var(--gold)}
.card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-weight:400;color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.row.two{grid-template-columns:1fr 1fr}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
input.big{font-size:20px;font-weight:700;text-align:center;padding:10px 6px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--gold);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.switch{position:relative;width:50px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--gold)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.organ{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:10px;background:var(--card)}
.organ.off{opacity:.55}
.organ .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.organ .name{font-weight:700;font-size:15.5px}
.organ .meta{font-size:12.5px;color:var(--muted)}
.res{font-variant-numeric:tabular-nums;background:var(--calc);border-radius:8px;padding:6px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.res b{font-size:17px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--gold);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:52px}
.quick button.on{background:var(--gold);color:var(--gold-ink);font-weight:700}
.interval{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.interval b{font-size:28px;color:var(--gold);font-family:var(--serif)}
.alert{border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600}
.alert.bad{background:var(--bad-bg);color:var(--bad)} .alert.warn{background:var(--warn-bg);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.tile b{display:block;font-size:24px;font-family:var(--serif)}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)} .tile.ok b{color:var(--ok)}
.rc{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--card)}
.rc.ok{border-left-color:var(--ok)} .rc.warn{border-left-color:var(--warn)} .rc.bad{border-left-color:var(--bad)}
.rc .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--calc);color:var(--muted)}
.track{position:relative;height:14px;background:var(--calc);border-radius:7px;display:flex;overflow:visible}
.track i{display:block;height:100%} .track i:first-child{border-radius:7px 0 0 7px}
.track .a{background:var(--c1)} .track .b{background:var(--c2)} .track .c{background:var(--c3)}
.track .lim{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--bad);border-radius:2px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nums b{display:block;color:var(--ink);font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--gold);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn[disabled]{opacity:.45;cursor:default}
label.btn{display:block}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{border-color:var(--line);color:var(--muted);font-weight:500}
.btn:focus-visible,.chip:focus-visible,.quick button:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.nav .btn{flex:1;max-width:340px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.x{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px;text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9}
.iosHint{max-width:720px;margin:12px auto 0;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px;margin-inline:16px}
@media (min-width:752px){.iosHint{margin-inline:auto}}
.iosHint button{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.credit{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.credit .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:2px 8px}
[hidden]{display:none!important}
#report{display:none}
.rp{font-family:"Times New Roman",Times,serif;color:#111;border:4px double #a8842c;padding:14px 16px;font-size:10.5pt;background:#fff}
.rp-h{display:flex;justify-content:space-between;gap:12px;border-bottom:3px double #a8842c;padding-bottom:6px}
.rp-org{font-size:8.5pt;color:#555;letter-spacing:.03em}.rp-t{font-size:15pt;font-weight:700;margin-top:4px}
.rp-no{font-size:8.5pt;text-align:right;color:#333;white-space:nowrap}
.rp-tag{font-size:8.5pt;color:#9a6a00;font-style:italic;margin:4px 0 6px}
.rp h4{font-size:11pt;margin:10px 0 4px;border-bottom:1px solid #a8842c;padding-bottom:2px}
.rp-g{width:100%;border-collapse:collapse;font-size:9pt}
.rp-g th,.rp-g td{border:1px solid #bfb08a;padding:3px 4px;text-align:center;vertical-align:top}
.rp-g th{background:#f3ead3;font-weight:700}.rp-g td.l,.rp-g th:first-child{text-align:left}
.rp-g .s-bad{color:#a3282b;font-weight:700}.rp-g .s-warn{color:#946400;font-weight:700}.rp-g .s-ok{color:#2f7a4a;font-weight:700}
.rp-sig td{height:26px}
.rp-w{font-size:9pt;color:#a3282b;font-weight:700;margin:4px 0}
.rp-f{font-size:8pt;color:#555;margin:4px 0}
.rp-foot{display:flex;justify-content:space-between;gap:8px;border-top:3px double #a8842c;margin-top:10px;padding-top:4px;font-size:7.5pt;color:#555}
@media print{
  @page{size:A4 portrait;margin:10mm}
  .top .steps,.nav,.actions,.toast,.noprint{display:none!important}
  .top{position:static} main{padding:0} body{background:#fff}
  .rc,.card{break-inside:avoid}
  body.printing-report > *:not(#report){display:none!important}
  body.printing-report #report{display:block!important}
  .rp-g tr{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- alternative models and ranges ---------- */
// LQ-L (Astrahan 2008): linear above transition dose dT per fraction
function compLQL(D, n, ab, dT){ D = numv(D); n = numv(n); ab = numv(ab); dT = numv(dT);
  if (!Number.isFinite(D) || !(n > 0) || !(ab > 0)) return null; const d = D / n;
  if (!(dT > 0) || d <= dT) return D * (d + ab) / (2 + ab);
  const bedPerFx = dT + dT * dT / ab + (1 + 2 * dT / ab) * (d - dT); return n * bedPerFx / (1 + 2 / ab); }
function courseWith(o, c, f){ const C = S["c" + c]; const a = f(totalD(o, c, "a"), C.na); const b = S.boost ? f(totalD(o, c, "b"), C.nb) : null;
  return (a === null && b === null) ? NaN : (a || 0) + (b || 0); }
const dTval = () => { const v = numv(S.dT); return v > 0 ? v : 6; };
// EQD2 of each course with model f; previous courses take their recovery, the newest course none
function sumWith(o, f, withRec){ const t = three(), r = withRec ? clampR(o.r) / 100 : 0, r2 = withRec && t ? clampR(o.r2) / 100 : 0;
  const e1 = courseWith(o, 1, f); let e2 = courseWith(o, 2, f), e3 = t ? courseWith(o, 3, f) : 0;
  if (!Number.isFinite(e2) && Number.isFinite(e1)) e2 = 0; if (!Number.isFinite(e3) && Number.isFinite(e1)) e3 = 0;
  return { e1, e2, e3, cum: t ? e1 * (1 - r) + e2 * (1 - r2) + e3 : e1 * (1 - r) + e2 }; }
function lqlCum(o){ return sumWith(o, (D, n) => compLQL(D, n, o.ab, dTval()), true); }
function rangeOf(o){
  const ab = numv(o.ab); if (!(ab > 0)) return null;
  const vals = [Math.max(0.5, ab - 1), ab, ab + 1].map(x => { const f = (D, n) => comp(D, n, x); return [sumWith(o, f, true), sumWith(o, f, false)]; });
  if (!vals.every(([w]) => Number.isFinite(w.e1))) return null;
  const best = Math.min(...vals.map(([w]) => w.cum)), worst = Math.max(...vals.map(([, wo]) => wo.cum));
  const lim = limOf(o); return { best, worst, bestPct: lim > 0 ? best / lim * 100 : NaN, worstPct: lim > 0 ? worst / lim * 100 : NaN, abLo: Math.max(0.5, ab - 1), abHi: ab + 1 };
}
function rangeLine(o){ const X = rangeOf(o); if (!X) return "";
  const lim = limOf(o), tag = lim > 0 && X.worst > lim ? ` <b style="color:var(--bad)">worst case exceeds the limit</b>` : "";
  let s = `Range ${f1(X.best)}–${f1(X.worst)} Gy (best: chosen recovery, worst: no recovery; α/β ${X.abLo}–${X.abHi})${tag}`;
  if (hiFx()) { const L = lqlCum(o); s += ` · LQ-L (dT ${dTval()} Gy): ${f1(L.cum)} Gy`; }
  return s; }

function vEvidence(){
  const site = P.sites[S.site], used = new Set(["ESTRO22","ESTRO23","ASTRO24"].concat(S.site === "CNS" ? ["EANO25"] : [], S.site === "SRS" ? ["EANO25","UK17","TG101","HYTEC_BR","HYTEC_ON","MCKAY17"] : [], ["TH","AB"].includes(S.site) ? ["STROOM25"] : []));
  site.protocols.forEach(p => p.refs.forEach(r => used.add(r)));
  const cell = (v) => v.limS == null ? `<span style="color:var(--muted)">–</span>` : `${v.limS}${v.limL != null ? ` → ${v.limL} <small>(≥${v.cut} mo)</small>` : ""}<br><small>${esc(v.m)} · α/β ${v.ab}</small>`;
  const prots = site.protocols.filter(p => p.id !== "BOC");
  return `<h2>Evidence</h2>${vSelfTest()}<p class="lead">${SITENAME[S.site]}: cumulative EQD2 limits (Gy) by protocol, recovery evidence, and references.</p>
  <div class="card"><h3>What the major bodies say</h3>
    <p class="note" style="color:var(--ink)"><b>ESTRO–EORTC (2022):</b> defines Type 1 / Type 2 re-irradiation and reporting; sum doses as EQD2/BED with relevant α/β; record the source and method of the previous dose; if the previous plan is unavailable, assume the prescription dose reached the OAR. It gives <b>no organ-specific cumulative limits</b>. Survey (2023): the most common minimum interval used is 6–12 months.</p>
    <p class="note" style="color:var(--ink)"><b>ASTRO:</b> no re-irradiation guideline for these sites; its 2023 education panel summarised the ESTRO–EORTC consensus. The US society guidance used here is the <b>American Radium Society</b> AUC (H&N).</p>
    ${S.site === "TH" ? `<p class="note" style="color:var(--ink)"><b>ESTRO (2026) thoracic guideline:</b> interval ≥6 months (strong, 96%); ECOG 0–1; life expectancy ≥6 months; avoid with active widespread metastases; caution with interstitial lung disease or persisting grade ≥3 toxicity; rigid registration first, EQD2 summation; recovery applied cautiously. It gives <b>no numerical limits</b> and refers to the ARS consensus. <b>ARS (2025):</b> composite EQD2 limits (cord 57, oesophagus 100, great vessels 120, airways 110, plexus 85 Gy; lung V20 &lt;40%); no recovery credit endorsed.</p>` : ""}
    ${S.site === "AB" ? `<p class="note" style="color:var(--ink)"><b>Evidence is limited.</b> The ReCOG systematic review (2025; 32 studies, 1,231 patients, mostly liver and pancreas) found no consensus and could not define organ-specific dose–outcome data; only 7 studies reported cumulative limits. Late grade ≥3 toxicity was typically 5–15%; baseline liver function predicted fatal RILD. Treat abdominal limits as published examples, not validated thresholds.</p>` : ""}
    ${S.site === "CNS" ? `<p class="note" style="color:var(--ink)"><b>ESTRO/EANO (2025), glioblastoma:</b> KPS ≥60 and interval &gt;6 months; re-irradiation EQD2 no less than 36 Gy (e.g. 35 Gy/10 fx or 27–30 Gy/3–5 fx); sum doses as EQD2 with α/β 3 Gy; recovery only for brain and spinal cord; no consensus for brainstem; optic recovery uncertain. It gives <b>no numerical cumulative limits</b>; the limits here come from the literature it does not replace.</p>` : ""}
    <p class="note" style="color:var(--ink)"><b>UK:</b> UK SABR Consortium pelvic re-irradiation guidance (2025) gives the recovery rule. No UK H&N re-irradiation guideline was found.</p>
    ${S.site === "SRS" ? `<p class="note" style="color:var(--ink)"><b>Cranial SRS/SRT re-irradiation:</b> two checks run together. (1) <b>Per course</b>, physical dose against fraction-specific tolerances for 1, 3 and 5 fractions: UK SABR Consortium consensus (Hanna 2018; mandatory and optimal), AAPM TG-101 (Benedict 2010; point maximum plus volume thresholds) and HyTEC 2021 (optic pathway Dmax 10 / 20 / 25 Gy for <1% optic neuropathy; normal brain 1 fx V12 5 / 10 / >15 cc ≈ 10 / 15 / 20% symptomatic radionecrosis, 3 fx V18 <30 cc and V23 <7 cc, 5 fx V28.8 <3–7 cc). These come from patients without previous irradiation: HyTEC reports prior SRS raised brain adverse radiation effects about 5-fold and prior irradiation raised optic neuropathy about 10-fold, so they are upper bounds when re-treating. (2) <b>Cumulative</b> EQD2 (α/β 2; LQ-L above 6–8 Gy per fraction) against re-irradiation limits: brain 100 Gy₂ (Mayer & Sminia), brainstem <100 and optic structures <75 Gy₂ (Stiefel via Rades), cord ≈67.8 Gy₂ (Nieder). For repeat SRS to the same lesion, composite (plan-sum) brain V40 of 0.28 / 0.76 / 1.60 cc corresponded to about 10 / 20 / 50% radionecrosis (McKay 2017, analysed in HyTEC); recent series report symptomatic radionecrosis of about 13–24% after repeat SRS. Fractionated SRT (3–5 fx) is commonly preferred for larger lesions to lower radionecrosis risk; decide case by case in the neuro-oncology MDT.</p>` : ""}
    <p class="note" style="color:var(--ink)"><b>Third course (second re-irradiation):</b> no guideline or consensus gives limits or recovery rules for three or more courses; published series are small and mostly CNS and spine. ESTRO–EORTC (2022) requires all previous courses to be summed. The app therefore applies the same cumulative limits to the sum of all three courses, takes recovery separately for each previous course on its own interval to Course 3, and uses the shortest interval (Course 2 → 3) for interval-dependent limits. Treat a third course as individual, multidisciplinary decision-making with full informed consent.</p></div>
  <div class="card"><h3>Cumulative limits by protocol</h3><div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%">

    <tbody>${site.organs.map((n, i) => `<tr><td style="padding:6px;border-bottom:1px solid var(--line);font-weight:600">${esc(n)}</td>${prots.map(p => `<td style="padding:6px;border-bottom:1px solid var(--line);vertical-align:top">${cell(p.organs[i])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>

  <div class="card"><h3>About and privacy</h3><p class="note" style="color:var(--ink)">Calculation aid for qualified medical physicists and radiation oncologists. <b>Not a medical device</b>; it does not diagnose, treat, cure or prevent any medical condition. Check every result independently (TPS, hand calculation or second checker) and consult a qualified healthcare professional for medical decisions.</p><p class="note">Everything you enter stays on this device; the app sends nothing. <a href="privacy.html" style="color:var(--gold)">Privacy policy</a></p></div>
  <p class="foot">${CREDIT}</p>`;
}

function loadArch(){ try { return JSON.parse(localStorage.getItem(ARCH_KEY) || "[]"); } catch (_) { return []; } }

function withState(st, fn){ const keep = S; S = norm3(st); try { return fn(); } finally { S = keep; } }

    const m = months();
    active().forEach(([o, i]) => { const R = calcOrgan(o), X = remaining(o);
      rows.push([x.savedAt.slice(0, 16).replace("T", " "), x.id, S.name, S.mrn, SITENAME[S.site], proto().label, S.c1end, S.c2start, Number.isFinite(m) ? m.toFixed(1) : "",
        S.c1.tps, S.c1.meth, S.c2.tps, S.c2.meth, o.n, o.ab, o.m, f1(R.e1), R.r, o.basis, f1(R.res), f1(R.e2), f1(R.nom), f1(R.cum),
        R.lim > 0 ? f1(R.lim) : "", Number.isFinite(R.pct) ? R.pct.toFixed(0) : "", R.lab,
        X ? f1(X.rem) : "", X && X.n > 0 && Number.isFinite(X.D) ? f1(X.D) : "", X && X.n > 0 ? X.n : "", o.note || "", [S.c1.dvha, S.c1.dvhb].filter(Boolean).join(" | "), [o.srca1, o.srcb1].filter(Boolean).join(" | "), [S.c2.dvha, S.c2.dvhb].filter(Boolean).join(" | "), [o.srca2, o.srcb2].filter(Boolean).join(" | "),
        ...(() => { const G = rangeOf(o), Q = presOptions(o), pl = Q && X && X.n > 0 ? Q.rows.find(z => z.n === X.n) : null; return [G ? f1(G.best) : "", G ? f1(G.worst) : "", hiFx() ? f1(lqlCum(o).cum) : "", Q ? f1(Q.remWo) : "", pl ? f1(pl.wo) : ""]; })(),
        S.rev || 1, (S.sign || {}).calcBy || "", (S.sign || {}).checkBy || "", S.locked ? "yes" : "no", x.appVersion || "", x.protoVersion || "",
        ...(three() ? [3, "Course 3", S.c2end, S.c3start, Number.isFinite(m13()) ? m13().toFixed(1) : "", Number.isFinite(m23()) ? m23().toFixed(1) : "", S.c3.tps, S.c3.meth, f1(R.e3), R.r2, o.basis2 || "", f1(R.res2), f1(R.prior), [S.c3.dvha, S.c3.dvhb].filter(Boolean).join(" | "), [o.srca3, o.srcb3].filter(Boolean).join(" | ")]
          : [2, "Course 2", "", "", "", "", "", "", "", "", "", "", f1(R.prior), "", ""]),
        isSRS() ? srsSet().label : "", srsCsvOrgan(o, i), isSRS() ? srsCsvBrain() : "", isSRS() ? (S.v40 ?? "") : ""].map(v => (v === "–" ? "" : v)));
    });
  });
  return rows;
}
const toCsv = rows => "\ufeff" + rows.map(r => r.map(v => { const t = String(v ?? ""); return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(",")).join("\r\n");
function download(name, text, type){
  try { const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); toast("Export started: " + name); }
  catch (_) { toast("Download blocked here – use Show CSV text"); }
}
const stamp = () => new Date().toISOString().slice(0, 10);

/* ---------- render & events ---------- */
function render(){
  const L = stepList(); if (!(S.step >= 0 && S.step < L.length)) S.step = 0;
  $("steps").innerHTML = L.map(([s], i) => `<button type="button" class="chip ${i===S.step?"on":""} ${i<S.step?"done":""}" data-step="${i}">${i+1}. ${s}</button>`).join("");
  const html = L[S.step][1]();
  $("main").innerHTML = S.locked && S.step < stepIdx("Results") ? `<div class="alert warn">Approved and locked (v${S.rev || 1}). Inputs are read-only; create a new version on Results to edit.</div><fieldset disabled style="border:0;padding:0;margin:0;min-width:0;display:grid;gap:14px">${html}</fieldset>` : html;
  $("backBtn").style.visibility = S.step === 0 ? "hidden" : "visible";
  $("nextBtn").textContent = S.step === L.length - 1 ? "Back to setup" : "Next: " + L[S.step + 1][0];
  const on = $("steps").querySelector(".on"); if (on && on.scrollIntoView) try { on.scrollIntoView({ inline: "center", block: "nearest" }); } catch (_) {}
  save();
}
function go(n){ S.step = Math.max(0, Math.min(stepList().length - 1, n)); render(); try { window.scrollTo(0, 0); } catch (_) {} }
function live(){
  active().forEach(([o, i]) => { const R = calcOrgan(o);
    const set = (k, v) => { const el = document.querySelector(`[data-live="${k}"]`); if (el) el.textContent = f1(v) + " Gy"; };
    set(`e1-${i}`, R.e1); set(`e2-${i}`, R.e2); set(`e3-${i}`, R.e3); set(`res-${i}`, R.res);
    const pr = document.querySelector(`[data-live="prior-${i}"]`); if (pr) pr.textContent = `${f1(R.res)} + ${f1(R.res2)} = ${f1(R.prior)} Gy`;
    document.querySelectorAll(`[data-live="rem-${i}"],[data-live="rem2-${i}"]`).forEach(el => el.innerHTML = remLine(o));
    [1, 2, 3].forEach(c => { const el = document.querySelector(`[data-live="bd${c}-${i}"]`); if (el) el.innerHTML = breakdown(o, c); }); });
  const hf = $("hiFx"); if (hf) hf.hidden = !hiFx();
  const w = $("recWarn"); if (w) w.hidden = !recWarnOn();
  const d = $("dblWarn"); if (d) d.hidden = !doubleCount();
  document.querySelectorAll("[data-rq]").forEach(b => b.classList.toggle("on", numv(S.organs[b.dataset.rq].r) === numv(b.dataset.p)));
  document.querySelectorAll("[data-rq2]").forEach(b => b.classList.toggle("on", numv(S.organs[b.dataset.rq2].r2) === numv(b.dataset.p)));
  save();
}
document.addEventListener("change", e => { const d = e.target.dataset; if (isSRS() && d.c && d.f === "na" && !e.target.closest("#report")) render(); });
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (t.dataset.dvhtv !== undefined || t.dataset.dvhmap !== undefined || t.dataset.dvhover) return;
  if (t.id === "calcBy" || t.id === "checkBy"){ sign()[t.id] = t.value; save(); return; }
  if (t.id === "archQ"){ archQ = t.value; const pos = t.selectionStart; render(); const n = $("archQ"); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } return; }
  if (d.k === "protoSel") return;
  if (d.bv){ const [c, k] = d.bv.split("|"), C = S["c" + c]; C.bv = C.bv || {}; C.bv[k] = t.value; live(); return; }
  if (d.k){ S[d.k] = t.type === "checkbox" ? t.checked : t.value;
    if (d.k === "srsSet"){ render(); return; }
    if (d.k === "v40"){ const el = document.querySelector('[data-live="v40"]'), V = srsV40(); if (el) el.innerHTML = (V ? `Composite V40 ${f1(V.v)} cc → symptomatic radionecrosis risk <b class="s-${V.st}">${V.risk}</b>` : "Enter V40 from the summed plan to estimate risk.") + " McKay 2017 (via HyTEC): composite V40 0.28 / 0.76 / 1.60 cc ≈ 10 / 20 / 50% radionecrosis after two SRS courses."; save(); return; }
    if (d.k === "three"){ norm3(S); if (proto().rec === "uk") applyProto(S.proto); render(); toast(S.three ? "Third course added: Course 1 and 2 are previous, Course 3 is planned" : "Back to two courses"); return; }
    if (d.k === "boost") render(); else live(); return; }
  if (d.c){ S["c" + d.c][d.f] = t.value; if (d.f === "meth") render(); else live(); return; }
  if (d.o !== undefined){ const o = S.organs[+d.o];
    if (d.f === "limS"){ o.limS = t.value; o.limL = null; o.cut = null; o.note = "Edited locally"; }
    else o[d.f] = t.type === "checkbox" ? t.checked : t.value;
    if (d.f === "on") t.closest(".organ").classList.toggle("off", !t.checked); live(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.dvhfile && t.files && t.files[0]){ dvhLoad(+t.dataset.dvhfile, t.files[0]); return; }
  if (t.dataset.dvhover && DVH){ DVH.over[t.dataset.dvhover] = t.value; render(); return; }
  if (t.dataset.dvhmap !== undefined && DVH){ DVH.map[+t.dataset.dvhmap] = +t.value; render(); return; }
  if (t.dataset.dvhtv !== undefined && DVH){ DVH.tv[+t.dataset.dvhtv] = numv(t.value); render(); return; }
  if (t.id === "impFile" && t.files && t.files[0]){ const r = new FileReader(); r.onload = () => { try {
      const inc = JSON.parse(r.result); const list = Array.isArray(inc) ? inc : inc.cases; if (!Array.isArray(list)) throw 0;
      const a = loadArch(); let added = 0; list.forEach(x => { if (x && x.id && x.state && !a.some(y => y.id === x.id)) { a.push(x); added++; } });
      a.sort((p, q) => String(q.savedAt).localeCompare(String(p.savedAt))); if (saveArch(a)) { render(); toast(`Imported ${added} new case${added === 1 ? "" : "s"}`); }
    } catch (_) { toast("This file is not an app backup"); } }; r.readAsText(t.files[0]); return; }
  if (t.dataset.k === "protoSel"){ applyProto(t.value); render(); toast("Protocol applied: limits, α/β, metrics and recovery updated"); return; }
  if (t.type === "date"){ if (proto().rec === "uk") applyProto(S.proto); render(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.step) return go(+d.step);
  if (d.site){ if (d.site !== S.site){ const k3 = three(); freshState(d.site); S.three = k3; render(); toast(SITENAME[d.site] + " organ list loaded"); } return; }
  if (d.mode){ const c = d.mode[0], k = d.mode[1]; S["c" + c][k + "m"] = d.v; render(); toast(d.v === "fx" ? "Doses now read as dose per fraction" : "Doses now read as total dose"); return; }
  if (d.rq !== undefined){ S.organs[+d.rq].r = +d.p; const inp = document.querySelector(`[data-o="${d.rq}"][data-f="r"]`); if (inp) inp.value = d.p; live(); return; }
  if (d.rq2 !== undefined){ S.organs[+d.rq2].r2 = +d.p; const inp = document.querySelector(`[data-o="${d.rq2}"][data-f="r2"]`); if (inp) inp.value = d.p; live(); return; }
  const act = d.act;
  if (act === "ukAll"){
    if (three()){ const q1 = ukRule(m13()), q2 = ukRule(m23()); active().forEach(([o]) => { o.r = q1; o.basis = `UK SABR 2025 rule (${q1}% for ${f1(m13())} mo to Course 3)`; o.r2 = q2; o.basis2 = `UK SABR 2025 rule (${q2}% for ${f1(m23())} mo to Course 3)`; }); render(); toast(`UK rule applied: Course 1 ${q1} %, Course 2 ${q2} %`); }
    else { const q = ukRule(months()); active().forEach(([o]) => { o.r = q; o.basis = `UK SABR 2025 rule (${q}% for ${f1(months())} mo)`; }); render(); toast(`UK rule applied: ${q} %`); } }
  if (act === "addOrgan"){ S.organs.push(blankOrgan("")); render(); const ins = document.querySelectorAll('[data-f="n"]'); ins[ins.length - 1].focus(); }
  if (d.dvhk){ S["dvhk" + d.dvhk[0]] = d.dvhk[1]; render(); return; }
  if (d.report){ const x = loadArch().find(y => y.id === d.report); if (x){ S = norm3(JSON.parse(JSON.stringify(x.state))); S.caseId = x.caseId || x.id; S.step = stepIdx("Results"); render(); printReport(); } return; }
  if (d.open){ const x = loadArch().find(y => y.id === d.open); if (x){ S = norm3(JSON.parse(JSON.stringify(x.state))); S.caseId = x.caseId || x.id; S.step = stepIdx("Results"); render(); try { window.scrollTo(0, 0); } catch (_) {} toast("Case opened: " + (x.name || x.id)); } return; }
  if (d.del){ const c = document.querySelector(`[data-delconf="${d.del}"]`); if (c) c.hidden = false; return; }
  if (d.delno){ const c = document.querySelector(`[data-delconf="${d.delno}"]`); if (c) c.hidden = true; return; }
  if (d.delyes){ saveArch(loadArch().filter(y => y.id !== d.delyes));  render(); toast("Case deleted"); return; }
  if (d.pres){ PRESMODE = d.pres; render(); return; }
  if (act === "selftest"){ LASTTEST = selfTest(); render(); toast(LASTTEST.pass ? `All ${LASTTEST.n} checks passed` : `${LASTTEST.failed} checks failed`); return; }
  if (act === "report"){ printReport(); return; }
  if (act === "markCalc"){ const g = sign(); if (!g.calcBy.trim()) { toast("Enter who calculated"); return; } g.calcAt = new Date().toISOString(); render(); toast("Marked calculated"); return; }
  if (act === "approve"){ const g = sign();
    if (!g.calcBy.trim() || !g.checkBy.trim()) { toast("Enter both calculator and checker"); return; }
    if (g.calcBy.trim().toLowerCase() === g.checkBy.trim().toLowerCase()) { toast("The checker must be a different person"); return; }
    if (!g.calcAt) g.calcAt = new Date().toISOString(); g.checkAt = new Date().toISOString(); S.locked = true; archiveCurrent(); render(); toast("Approved, locked and archived"); return; }
  if (act === "newver"){ S.rev = (S.rev || 1) + 1; S.locked = false; S.sign = { calcBy: "", calcAt: "", checkBy: "", checkAt: "" }; render(); toast(`Version ${S.rev} created – previous version stays in the archive`); return; }
  if (act === "dvhApply"){ dvhApply(); return; }
  if (act === "dvhClose"){ DVH = null; render(); return; }
  if (act === "archive"){ archiveCurrent(); render(); }
  if (act === "expCsv") download(`ReRT_EQD2_archive_${stamp()}.csv`, toCsv(csvRows()), "text/csv;charset=utf-8");
  if (act === "expJson") download(`ReRT_EQD2_backup_${stamp()}.json`, JSON.stringify({ app: "ReRT EQD2", exported: new Date().toISOString(), cases: loadArch() }, null, 1), "application/json");
  if (act === "showCsv"){ const box = $("csvBox"); if (box){ box.innerHTML = `<textarea rows="8" readonly style="margin-top:8px;font-size:12px"></textarea>`; const ta = box.querySelector("textarea"); ta.value = toCsv(csvRows()).replace(/^\ufeff/, ""); ta.focus(); ta.select(); } }
  if (act === "example"){ if (three()) { example3(S.site); render(); toast("3-course example loaded (Course 3 is illustrative)"); } else { exampleState(S.site); render(); toast("Example case loaded"); } }
  if (act === "new"){ $("newConfirm").hidden = false; $("newConfirm").scrollIntoView({ block: "center" }); }
  if (act === "newNo") $("newConfirm").hidden = true;
  if (act === "newYes"){ DVH = null; const k3 = three(); freshState(S.site); S.three = k3; S.caseId = null; render(); toast("New patient"); }
  if (act === "copy") copySummary();
  if (act === "print") window.print();
});
$("backBtn").onclick = () => go(S.step - 1);
$("nextBtn").onclick = () => go(S.step === stepList().length - 1 ? 0 : S.step + 1);

function toast(t){ const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }
function copySummary(){
  const m = months(), site = CFG[S.site], p = proto();
  const crs = c => { const C = S["c"+c]; return `Course ${c}: TPS ${C.tps || "–"}; dose data ${C.meth || "–"}${C.reg ? "; software " + C.reg : ""}; fractions ${site.comp1} ${C.na || "–"}${S.boost ? `, ${site.comp2} ${C.nb || "–"}` : ""}; ${[C.dvha, C.dvhb].filter(Boolean).length ? "; DVH " + [C.dvha, C.dvhb].filter(Boolean).join(", ") : ""}; doses entered as ${C.am === "fx" ? "per fx" : "total"}${S.boost ? ` / ${C.bm === "fx" ? "per fx" : "total"}` : ""}`; };
  let s = `${site.title.toUpperCase()} – CUMULATIVE EQD2\n${CREDIT}\n${verLine()} · case v${S.rev || 1}${S.locked ? ` · approved (calc ${sign().calcBy}, check ${sign().checkBy})` : " · not approved"}\nPatient: ${S.name} | MRN: ${S.mrn}\nCourse 1 ended ${S.c1end || "–"}; Course 2 starts ${S.c2start || "–"}; interval ${mo(m)}${three() ? `\nCourse 2 ended ${S.c2end || "–"}; Course 3 starts ${S.c3start || "–"}; intervals to Course 3: from Course 1 ${mo(m13())}, from Course 2 ${mo(m23())}` : ""}\n`;
  s += `Protocol: ${p.label}${p.refs.length ? " [" + p.refs.map(k => P.refs[k]).join(" | ") + "]" : ""}\n${crs(1)}\n${crs(2)}${three() ? "\n" + crs(3) : ""}\n\n`;
  active().forEach(([o]) => { const R = calcOrgan(o); if (!Number.isFinite(R.cum)) return;
    s += `${o.n} [${o.m}, α/β ${o.ab}]: EQD2₁ ${f1(R.e1)} → ${f1(R.res)} Gy after ${R.r}% recovery${o.basis ? " (" + o.basis + ")" : ""}; ${three() ? `EQD2₂ ${f1(R.e2)} → ${f1(R.res2)} Gy after ${R.r2}% recovery${o.basis2 ? " (" + o.basis2 + ")" : ""}; EQD2₃ ${f1(R.e3)} Gy` : `EQD2₂ ${f1(R.e2)} Gy`}; cumulative ${f1(R.cum)} Gy (no recovery ${f1(R.nom)}); limit ${R.lim > 0 ? f1(R.lim) + " Gy" : "–"}${o.note ? " (" + o.note + ")" : ""} – ${R.lab}${Number.isFinite(R.pct) ? " " + R.pct.toFixed(0) + "%" : ""}; Course ${NC()} allowance: ${remLine(o).replace(/<[^>]+>/g, "")}\n`; });
  if (doubleCount()) s += "\nWARNING: recovery entered although this protocol's limits apply to the full Course 1 dose.\n";
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = s; ta.rows = 10; ta.className = "noprint"; $("main").appendChild(ta); ta.focus(); ta.select(); toast("Selected below. Copy it from there."); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(s).then(() => toast("Summary copied"), fallback); else fallback();
}
render();
(function(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
  let dismissed=false; try{dismissed=localStorage.getItem("rert-ios-hint")==="1";}catch(_){}
  if(ios&&!standalone&&!dismissed) $("iosHint").hidden=false;
  $("iosHintX").onclick=()=>{$("iosHint").hidden=true;try{localStorage.setItem("rert-ios-hint","1");}catch(_){}};
})();
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
